[workspace]
authors = ["vieomics"]
channels = ["conda-forge", "bioconda"]
name = "solutions"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
nextflow = ">=25.10"
apptainer = ">=1.3"

[tasks]
fetchngs = "nextflow run nf-core/fetchngs -r 1.13.0 -profile apptainer -c conf/fetchngs.config -c conf/resources.config --download_method sratools --input ids.csv --outdir results/fetchngs -resume"
bacass = "nextflow run nf-core/bacass -r 2.6.1 -profile apptainer,test_full -c conf/resources.config -params-file params/bacass.json -resume"
