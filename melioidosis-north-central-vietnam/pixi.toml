[workspace]
authors = ["vieomics"]
channels = ["conda-forge", "bioconda"]
name = "melioidosis-north-central-vietnam"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
nextflow = ">=25.10"
apptainer = ">=1.3"
awscli = ">=2.33"

[activation.env]
NXF_APPTAINER_CACHEDIR = ".apptainer-cache"

[tasks]
fetchngs-single = "nextflow run nf-core/fetchngs -r 1.13.0 -profile apptainer -c conf/fetchngs.config -c conf/resources.config --download_method sratools --input ids.single.csv --outdir results/fetchngs-single -resume"
fetchngs = "nextflow run nf-core/fetchngs -r 1.13.0 -profile apptainer -c conf/fetchngs.config -c conf/resources.config --download_method sratools --input ids.csv --outdir results/fetchngs -resume"

[feature.analysis.dependencies]
ncbi-amrfinderplus = "*"
mob_suite = "*"
kleborate = "*"
bwa = "*"
samtools = "*"
blast = "*"
spades = "*"
isescan = "*"
seqkit = "*"

[feature.plots.dependencies]
matplotlib = "*"

[environments]
analysis = ["analysis"]
plots = ["plots"]
