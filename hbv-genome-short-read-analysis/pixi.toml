[workspace]
authors = ["vieomics"]
channels = ["conda-forge", "bioconda"]
name = "hbv-genome-short-read-analysis"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
nextflow = ">=25.10"
fastqc = ">=0.12"
fastp = ">=0.23"
bwa = ">=0.7.17"
samtools = ">=1.21"
bcftools = ">=1.21"
multiqc = ">=1.27"
mafft = ">=7.525"
iqtree = ">=2.3,<3"
seqkit = ">=2.8"
python = ">=3.12"
biopython = ">=1.84"
pysam = ">=0.22"
matplotlib-base = ">=3.9"
pandas = ">=2.2"
numpy = ">=1.26"
jq = ">=1.7"
bowtie2 = ">=2.5.5,<3"
bedtools = ">=2.31.1,<3"
pigz = ">=2.8,<3"
phipack = ">=1.1,<2"
